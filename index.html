<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Structura – DSA Visualizer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#09090b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09090b;--pn:#101013;--rs:#17171b;--hv:#1e1e24;--sg:#2a2a32;--bd:#24242b;--bd2:#33333c;--tx:#f4f4f5;--tx2:#a1a1aa;--mu:#71717a;--ac:#7480ff;--acs:rgba(116,128,255,.13);--amber:#f5a524;--red:#f0605d;--green:#34d399;--vio:#a78bfa;--idle:#2e2e37;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light;--bg:#fafafa;--pn:#fff;--rs:#f4f4f6;--hv:#ebebef;--sg:#fff;--bd:#e6e6ea;--bd2:#d4d4da;--tx:#17171a;--tx2:#55555f;--mu:#8a8a96;--ac:#4a55e8;--acs:rgba(74,85,232,.1);--amber:#d98a04;--red:#dc3b38;--green:#13a06d;--vio:#7c5cf0;--idle:#d9d9e0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
svg{flex:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em}
.brand .sl,.brand .mu{color:var(--mu);font-weight:400}
.hr{display:flex;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--rs);font-size:13px;font-weight:500;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--hv);border-color:var(--bd2)}
.btn:active,.ib:active,.play:active{transform:scale(.97)}
.btn.pri{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.btn.pri:hover{opacity:.88}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--tx2);transition:background .15s,color .15s,transform .05s}
.ib:hover{background:var(--hv);color:var(--tx)}
.app{display:grid;grid-template-columns:224px minmax(0,1fr)}
.side{padding:12px;border-right:1px solid var(--bd)}
.sec{padding:16px 10px 6px;font-size:12px;font-weight:500;color:var(--mu)}
.sec:first-child{padding-top:4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--tx2);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav:hover{background:var(--rs);color:var(--tx)}
.nav.on{background:var(--hv);color:var(--tx)}
.nav.on svg{color:var(--ac)}
.main{display:flex;flex-direction:column;gap:16px;padding:24px;min-width:0;max-width:1120px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hd>div{flex:1 1 360px;min-width:0}
h1{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.03em}
.sub{margin:4px 0 0;color:var(--tx2)}
.badge{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;color:var(--mu);font-size:12px}
.badge b{font:500 12px var(--mono);color:var(--tx)}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-bottom:1px solid var(--bd);font-size:13px;font-weight:500;color:var(--tx2)}
.ch .lang{margin-left:auto;font:400 11px var(--mono);color:var(--mu)}
.note{padding:8px 16px 4px;font:12px/1.5 var(--sans);color:var(--mu);white-space:normal;border-top:1px solid var(--bd);margin-top:6px}.note code{font:inherit;font-family:var(--mono);color:var(--tx2)}
.ch .seg{margin-left:auto}.ch .btn{height:28px;padding:0 10px;font-size:12px}.ch #fn{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}.ch .seg button{padding:0 8px}
.tools.stk .grp:last-child{flex:1 1 100%}.tools.stk #ops{margin-right:auto}   /* controls too wide for one row: operations get their own row, same for every op in the tab */
.tools{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;padding:14px}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--mu)}
input[type=text],input[type=number]{height:32px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:13px var(--mono);transition:border-color .15s,box-shadow .15s}
input[type=text]:hover,input[type=number]:hover{border-color:var(--bd2)}
input[type=text]:focus,input[type=number]:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
input[type=number]{width:80px;-moz-appearance:textfield}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none}
#data{width:250px;max-width:100%}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--bd);border-radius:10px;background:var(--rs)}
.seg:empty{display:none}
#vr{margin-top:12px}
.seg button{height:26px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--tx2);font-size:13px;font-weight:500;transition:color .15s,background .15s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--sg);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.stage{height:300px;display:flex;padding:20px;overflow:auto;background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:22px 22px}
.stage>*{margin:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 14px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--c)}
.cur,.cmp{--mc:var(--amber)}.swap,.del{--mc:var(--red)}.found,.sorted{--mc:var(--green)}.new,.pivot{--mc:var(--vio)}.mid,.ptr{--mc:var(--ac)}
:is(.cur,.cmp,.swap,.del,.found,.sorted,.new,.pivot,.mid,.ptr){--mb:color-mix(in srgb,var(--mc) 14%,var(--rs))}
.out{opacity:.3}
.bars{display:flex;gap:8px;align-items:flex-end;height:250px;width:100%;max-width:660px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;transition:opacity .25s}
.bar b{width:100%;border-radius:5px 5px 2px 2px;background:var(--mc,var(--idle));transition:height .35s cubic-bezier(.3,.8,.3,1),background .2s}
.bar span{font:500 11px var(--mono);color:var(--tx2)}
.bar em,.cell em{font:400 10px var(--mono);color:var(--mu);font-style:normal}
.cells,.list,.stack{display:flex;align-items:center;gap:8px}
.cell,.node span,.item{border:1px solid var(--mc,var(--bd2));background:var(--mb,var(--rs));border-radius:8px;font:500 14px var(--mono);transition:border-color .2s,background .2s}
.cell,.node span{min-width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;gap:1px}
.node{display:flex;align-items:center;gap:8px;position:relative;animation:pop .25s}
.node small,.item small,.cell small{position:absolute;padding:0 6px;border-radius:4px;background:var(--acs);color:var(--ac);font:500 10px/16px var(--mono)}
.node small,.cell small{top:-22px;left:0;white-space:nowrap}.cell{position:relative}
.item small{left:calc(100% + 10px);top:11px}
.arr{display:grid;color:var(--mu)}.nul{font:12px var(--mono);color:var(--mu)}
.list{flex-wrap:wrap;row-gap:30px;justify-content:center}
.stack{flex-direction:column;width:180px;gap:6px}
.item{position:relative;width:100%;height:40px;display:flex;align-items:center;justify-content:center;animation:pop .25s}
.base{width:100%;height:3px;border-radius:2px;background:var(--bd2)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
svg line{stroke:var(--bd2);stroke-width:1.5}
.tn circle{fill:var(--mb,var(--rs));stroke:var(--mc,var(--bd2));stroke-width:1.5;transition:fill .2s,stroke .2s}
.tn text{fill:var(--tx);font:500 13px var(--mono);text-anchor:middle}
.empty{color:var(--mu)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 14px}
.tr{display:flex;align-items:center;gap:2px}
.play{display:grid;place-items:center;width:38px;height:38px;margin:0 4px;border:0;border-radius:50%;background:var(--tx);color:var(--bg);transition:opacity .15s,transform .05s}
.play:hover{opacity:.88}
.play svg{fill:currentColor;stroke-width:1.5}
.scr{flex:1;min-width:160px;display:flex;align-items:center;gap:12px}
.cnt{min-width:54px;text-align:right;font:12px var(--mono);color:var(--mu)}
input[type=range]{--p:0%;-webkit-appearance:none;appearance:none;width:100%;height:16px;margin:0;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ac) var(--p),var(--bd2) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--bd2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ac)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;border:2px solid var(--pn);background:var(--tx);box-shadow:0 0 0 1px var(--bd2)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;border:2px solid var(--pn);background:var(--tx);box-shadow:0 0 0 1px var(--bd2)}
.low{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
.say{padding:14px}
.stp{display:inline-block;margin-bottom:6px;font:500 11px var(--mono);color:var(--ac)}
#say{margin:0;font-size:15px;line-height:1.55;min-height:46px}
.log{margin:0;padding:6px 0;list-style:none;max-height:190px;overflow:auto;position:relative;border-top:1px solid var(--bd)}
.log li{display:flex;gap:10px;padding:5px 14px;color:var(--mu);font-size:13px;cursor:pointer;transition:background .15s}
.log li:hover{background:var(--rs)}
.log li.on{background:var(--rs);color:var(--tx)}
.log li span{flex:none;width:20px;text-align:right;font:500 11px/20px var(--mono)}
pre{margin:0;padding:10px 0;font:13px/1.7 var(--mono);overflow:auto}
.ln{display:flex;padding-right:16px;white-space:pre}
.ln.on{background:var(--acs)}
.ln .t{flex:1;min-width:0;font:inherit;white-space:pre}
.ln span{flex:none;width:40px;padding-right:14px;text-align:right;color:var(--mu);opacity:.7;user-select:none}
.ln.on span{color:var(--ac);opacity:1}
.st{color:var(--green);font-style:normal}.ty{color:var(--green);color:color-mix(in srgb,var(--green) 55%,var(--ac));font-style:normal}
.k{color:var(--vio);font-style:normal}.n{color:var(--amber);font-style:normal}.f{color:var(--ac);font-style:normal}.c{color:var(--mu);font-style:normal}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:flex;gap:4px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--bd)}.sec{display:none}.nav{width:auto;flex:none;white-space:nowrap}.low{grid-template-columns:1fr}.main{padding:16px}header{padding:0 14px}}
.hash{display:flex;flex-direction:column;gap:6px}.row{display:flex;align-items:center;gap:8px;color:var(--mu)}.hash .cell{height:38px;min-width:46px}.row>.cell:first-child{background:var(--mb,var(--hv))}
kbd{font:500 11px var(--mono);padding:1px 6px;border:1px solid var(--bd2);border-radius:5px;color:var(--mu);background:var(--bg)}
#kb{margin-right:6px;color:var(--tx2)}#kb kbd{margin-left:6px}
.hint{margin:0;color:var(--mu);font-size:12px}.hint kbd{margin:0 2px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);padding:8px 14px;border:1px solid var(--bd2);border-radius:10px;background:var(--hv);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}#toast.on{opacity:1;transform:translate(-50%,0)}
#pal{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}#pal[hidden]{display:none}
.pbox{width:100%;max-width:480px;background:var(--pn);border:1px solid var(--bd2);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
#pq{width:100%;height:48px;padding:0 16px;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;font:14px var(--sans)}#pq:focus{box-shadow:none;border-color:var(--bd)}
#pl{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}#pl li{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;cursor:pointer;color:var(--tx2)}#pl li.on{background:var(--hv);color:var(--tx)}#pl li b{font-weight:500}#pl li span{margin-left:auto;font-size:12px;color:var(--mu)}#pl .none{cursor:default;color:var(--mu)}
@media(max-width:700px){#kb span,#kb kbd,.hint{display:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s;animation-timing-function:ease}
.tt,.tt *,.tt *::before,.tt *::after{transition:background-color .3s ease,color .3s ease,border-color .3s ease,fill .3s ease,stroke .3s ease,box-shadow .3s ease,opacity .3s ease!important}
.hp{display:flex;flex-direction:column;align-items:center;gap:12px}.mini{gap:4px}.mini .cell{min-width:34px;height:40px;padding:0 6px;font-size:12px}
.gv{display:flex;flex-direction:column;align-items:center;gap:10px}.ge{transition:stroke .2s}.ge:is(.cur,.cmp,.swap,.del,.found,.sorted,.new,.pivot,.mid,.ptr){stroke:var(--mc);stroke-width:2.5}.gw{fill:var(--mu);font:11px var(--mono);text-anchor:middle;paint-order:stroke;stroke:var(--pn);stroke-width:3px}.tn .dl{fill:var(--ac);font:500 11px var(--mono)}
.qs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px;font:12px var(--mono);color:var(--mu)}.qs b{font-weight:500;margin-right:4px}.qs em{font-style:normal}.chip2{padding:1px 8px;border:1px solid var(--bd2);border-radius:6px;background:var(--rs);color:var(--tx)}
.rq{display:flex;flex-direction:column;align-items:center;gap:8px}
.tn.mt circle{fill:var(--pn);stroke-dasharray:3 3}.cell.mt{background:transparent;border-style:dashed}
.rk{fill:none;stroke:var(--bd2);stroke-width:1.5;stroke-dasharray:2 5}
.pl{fill:var(--ac);font:500 10px var(--mono)}.ct{fill:var(--tx);font:600 18px var(--mono);text-anchor:middle}.cs{fill:var(--mu);font:11px var(--mono);text-anchor:middle}
.ce path{fill:none;stroke:var(--mu);stroke-width:1.5;transition:stroke .2s}.ce polygon{fill:var(--mu);transition:fill .2s}
.ce.wr path{stroke:var(--ac)}.ce.wr polygon{fill:var(--ac)}
.ce:is(.cur,.cmp,.swap,.del,.found,.sorted,.new,.pivot,.mid,.ptr) path{stroke:var(--mc);stroke-width:2.5}.ce:is(.cur,.cmp,.swap,.del,.found,.sorted,.new,.pivot,.mid,.ptr) polygon{fill:var(--mc)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ac)"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M10.5 7.2 6.5 16.8M13.5 7.2l4 9.6"/></svg>Structura<span class="sl">/</span><span class="mu">Visualizer</span></div>
  <div class='hr'><button class='btn' id='kb' data-ic='search'><span>Search</span><kbd id='kk'>Ctrl K</kbd></button><button class='ib' id='snd' aria-label="Toggle sound" title="Sound effects"></button><button class="ib" id="theme" aria-label="Toggle theme" title="Toggle theme"></button></div>
</header>
<div class="app">
  <nav class="side" id="nav" aria-label="Topics"></nav>
  <main class="main">
    <div class="hd"><div><h1 id="title"></h1><p class="sub" id="desc"></p><div class="seg" id="vr" role="group" aria-label="Variant"></div></div><span class="badge">Complexity<b id="cx"></b></span></div>
    <div class="card tools">
      <div class="grp">
        <label class="fld">Data<input type="text" id="data" placeholder="e.g. 7, 3, 9, 1" spellcheck="false"></label>
        <button class="btn" id="set">Apply</button><button class='btn' id='rnd' data-ic='shuffle'>Shuffle</button><div class='seg' id='pre' aria-label='Input presets'><button data-p='random'>Random</button><button data-p='sorted'>Sorted</button><button data-p='reversed'>Reversed</button><button data-p='nearly'>Nearly sorted</button></div>
      </div>
      <div class="grp">
        <div class="seg" id="ops"></div>
        <label class="fld" id="lv">Value<input type="number" id="v" value="42"></label>
        <label class="fld" id="li">Index<input type="number" id="i" value="0"></label>
        <button class="btn pri" id="run" data-ic="play">Run</button>
      </div>
    </div>
    <div class="card">
      <div class="stage" id="stage"></div>
      <div class="legend"><span><i style="--c:var(--amber)"></i>Comparing</span><span><i style="--c:var(--red)"></i>Swap / remove</span><span><i style="--c:var(--ac)"></i>Pointer</span><span><i style="--c:var(--vio)"></i>Pivot / new</span><span><i style="--c:var(--green)"></i>Sorted / found</span></div>
    </div>
    <div class="card ctl">
      <div class="tr">
        <button class="ib" id="rs" title="Reset (R)" aria-label="Reset" data-ic="rotate-ccw"></button>
        <button class="ib" id="bk" title="Step back (←)" aria-label="Step back" data-ic="chevron-left"></button>
        <button class="play" id="pp" title="Play / pause (Space)" aria-label="Play or pause"></button>
        <button class="ib" id="fw" title="Step forward (→)" aria-label="Step forward" data-ic="chevron-right"></button>
      </div>
      <div class="scr"><input type="range" id="sc" min="0" max="0" value="0" aria-label="Timeline"><span class="cnt" id="cnt"></span></div>
      <div class="seg" id="spd" role="group" aria-label="Speed"><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
    </div>
    <div class="low">
      <div class="card"><div class="ch" data-ic="message">Explanation</div><div class="say"><span class="stp" id="stp"></span><p id="say"></p></div><ol class="log" id="log"></ol></div>
      <div class="card"><div class="ch" data-ic="code"><span id="fn">code.js</span><div class="seg" id="lg" role="group" aria-label="Language"></div><button class="btn" id="cp" title="Copy code" aria-label="Copy code">Copy</button></div><pre id="code"></pre></div>
    </div>
  </main>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const HLX={
 js:{c:"\\/\\/.*$",k:"function|let|const|return|if|else|for|while|do|new|break|throw|continue|of",t:""},
 py:{c:"#.*$",k:"def|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|raise|break|continue",t:""},

 {k:'run',label:'Run',args:'v',vl:'Source node',vd:0,cx:'O(V²) as shown · O(E log V) with a heap',code:[`function dijkstra(graph, src) {`,`  const dist = new Array(n).fill(Infinity);`,`  dist[src] = 0;`,`  while (unvisited.length) {`,`    const u = closestUnvisited(dist);`,`    for (const [w, cost] of graph[u])`,`      if (dist[u] + cost < dist[w])`,`        dist[w] = dist[u] + cost;   // relax`,`    markVisited(u);`,`  }`,`}`],

function draw(){const f=fr[ix];$("#stage").innerHTML=VIEWS[item.view](f.d,f.m);$("#say").textContent=f.t;
  document.querySelectorAll(".ln").forEach(l=>l.classList.toggle("on",+l.dataset.i===lnFor(f.ln)));
  const lg=$("#log");lg.querySelectorAll("li").forEach((l,i)=>{l.classList.toggle("on",i===ix);if(i===ix)lg.scrollTop=l.offsetTop-lg.clientHeight/2});
  const sc=$("#sc");sc.max=Math.max(fr.length-1,0);sc.value=ix;sc.style.setProperty("--p",(fr.length>1?ix/(fr.length-1)*100:0)+"%");$("#cnt").textContent=`${ix+1} / ${fr.length}`;$("#stp").textContent=`Step ${ix+1}`;$("#pp").innerHTML=ic(timer?"pause":"play",18)}
function go(i,q){const o=ix;ix=Math.max(0,Math.min(fr.length-1,i));draw();if(!q&&ix!==o)sfx(fr[ix],ix===fr.length-1)}
function pause(){clearInterval(timer);timer=null;if(fr.length)draw()}
function play(){if(timer)return pause();if(ix>=fr.length-1)ix=0;
  timer=setInterval(()=>{if(ix>=fr.length-1)return pause();go(ix+1)},speed());draw()}
function run(){pause();const r=op.gen(item.s,args());if(r.s)item.s=r.s;load(r);if(fr.length>1)play()}
function setData(){pause();const raw=$('#data').value.split(/[,\s]+/).filter(Boolean),n=raw.map(Number).filter(Number.isFinite);if(n.length<raw.length){const k=raw.length-n.length;toast(`Ignored ${k} non-numeric ${k>1?'entries':'entry'}.`)}$('#data').value=n.join(', ');
  item.s=item.mk(n);item.algo?load(op.gen(item.s,args())):ready()}

nav();
/* ---------- sound (Web Audio, no assets) ---------- */
let AC=null,on=true;try{on=localStorage.getItem("snd")!=="0"}catch(e){}
function wake(){if(!on)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
addEventListener("pointerdown",wake);addEventListener("keydown",wake);
function tone(f,t,d,type,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.008);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}
function sfx(f,last){if(!on||!AC)return;const m=f.m,ks=Object.keys(m),has=c=>ks.find(k=>m[k]===c);
  const fq=k=>item.view==="bars"&&f.d.a?200+Math.abs(f.d.a[k])/Math.max(...f.d.a.map(Math.abs),1)*700:260+((parseInt(k)||0)%12)*45;
  if(last&&(has("sorted")!==undefined||has("found")!==undefined||has("new")!==undefined)){[523,659,784,1047].forEach((x,i)=>tone(x,i*.09,.22,"triangle",.1));return}
  const sw=has("swap"),dl=has("del"),nw=has("new"),fd=has("found"),cm=["cmp","cur","mid","ptr","pivot"].map(has).find(x=>x!==undefined);
  if(sw!==undefined)tone(fq(sw),0,.12,"square",.06);
  else if(dl!==undefined)tone(150,0,.16,"sawtooth",.07);
  else if(nw!==undefined)tone(fq(nw),0,.14,"triangle",.12);
  else if(fd!==undefined){tone(fq(fd),0,.12,"triangle",.1);tone(fq(fd)*1.5,.07,.15,"triangle",.1)}
  else if(cm!==undefined)tone(fq(cm),0,.07,"sine",.1)}
const setSnd=v=>{on=v;$("#snd").innerHTML=ic(v?"volume-2":"volume-x");try{localStorage.setItem("snd",v?"1":"0")}catch(e){}};
setSnd(on);$("#snd").onclick=()=>{setSnd(!on);if(on){wake();sfx({m:{0:"cmp"},d:{a:[5]}},false)}};

$("#nav").onclick=e=>{const b=e.target.closest(".nav");if(!b)return;const f=FAMS.find(x=>x.id===b.dataset.fam);
  pick(f&&f.m.some(x=>x[0]===FV[f.id])?FV[f.id]:b.dataset.id)};
$("#vr").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.v!==item.id)pick(b.dataset.v)};
$("#ops").onclick=e=>{const b=e.target.closest(".chip");if(b)pickOp(b.dataset.k)};
document.body.insertAdjacentHTML('beforeend','<div id="toast" role="status"></div><div id="pal" hidden><div class="pbox"><input id="pq" type="text" placeholder="Jump to a data structure or algorithm…" autocomplete="off" spellcheck="false"><ul id="pl"></ul></div></div>');
$('.main').insertAdjacentHTML('beforeend','<p class="hint"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> step · <kbd>R</kbd> reset · <kbd id="kh">Ctrl K</kbd> search</p>');
if(/Mac|iPhone|iPad/.test(navigator.platform))$('#kk').textContent=$('#kh').textContent='⌘K';
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};
let pi=0,pf=[];
function pRender(){const q=$('#pq').value.trim().toLowerCase();pf=ITEMS.filter(x=>(x.name+' '+x.g).toLowerCase().includes(q));pi=Math.min(pi,Math.max(pf.length-1,0));
  $('#pl').innerHTML=pf.map((x,i)=>`<li data-i='${i}' class='${i===pi?'on':''}'>${ic(IC[x.id])}<b>${x.name}</b><span>${x.g}</span></li>`).join('')||'<li class=none>No matches</li>';const on=$('#pl .on');if(on)on.scrollIntoView({block:'nearest'})}
const pOpen=()=>{$('#pal').hidden=false;$('#pq').value='';pi=0;pRender();$('#pq').focus()},pClose=()=>{$('#pal').hidden=true};
$('#pq').oninput=()=>{pi=0;pRender()};
$('#pq').onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(pf.length){pi=(pi+(e.key==='ArrowDown'?1:-1)+pf.length)%pf.length;pRender()}}else if(e.key==='Enter'&&pf[pi]){pick(pf[pi].id);pClose()}else if(e.key==='Escape')pClose()};
$('#pl').onclick=e=>{const l=e.target.closest('li[data-i]');if(l){pick(pf[+l.dataset.i].id);pClose()}};
$('#pal').onclick=e=>{if(e.target.id==='pal')pClose()};$('#kb').onclick=pOpen;
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').hidden?pOpen():pClose()}});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(item&&id!==item.id&&ITEMS.some(x=>x.id===id))pick(id)});
$('#pre').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=item.init.length,r=()=>1+Math.random()*98|0,a=Array.from({length:n},r);
  if(b.dataset.p!=='random')a.sort((x,y)=>x-y);if(b.dataset.p==='reversed')a.reverse();
  if(b.dataset.p==='nearly')for(let k=0;k<2;k++){const x=Math.random()*(n-1)|0;[a[x],a[x+1]]=[a[x+1],a[x]]}
  $('#data').value=a.join(', ');setData()};
[$('#v'),$('#i')].forEach(el=>el.onkeydown=e=>{if(e.key==='Enter'&&!item.algo)run()});
$("#run").onclick=run;$("#set").onclick=setData;$("#data").onchange=setData;
$("#rnd").onclick=()=>{const n=6;$("#data").value=Array.from({length:n},()=>1+Math.random()*98|0).join(", ");setData()};
$("#v").onchange=$("#i").onchange=()=>{if(item.algo){pause();load(op.gen(item.s,args()))}};
$("#pp").onclick=play;$("#fw").onclick=()=>{pause();go(ix+1)};$("#bk").onclick=()=>{pause();go(ix-1)};$("#rs").onclick=()=>{pause();go(0,1)};
$("#spd").onclick=e=>{const b=e.target.closest("button");if(!b)return;SPD=+b.dataset.s;document.querySelectorAll("#spd button").forEach(x=>x.classList.toggle("on",x===b));if(timer){pause();play()}};
$("#sc").oninput=e=>{pause();go(+e.target.value,1)};
$("#log").onclick=e=>{const l=e.target.closest("li");if(l){pause();go(+l.dataset.i)}};
document.onkeydown=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=="range")return;
  if(e.key===" "){e.preventDefault();play()}else if(e.key==="ArrowRight"){e.preventDefault();pause();go(ix+1)}else if(e.key==="ArrowLeft"){e.preventDefault();pause();go(ix-1)}else if(e.key==="r"){pause();go(0,1)}};
document.onkeyup=e=>{if(e.key===" "&&!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()};
let th="dark";try{th=localStorage.getItem("th")||"dark"}catch(e){}
const setTh=t=>{th=t;document.documentElement.dataset.theme=t;$("#theme").innerHTML=ic(t==="dark"?"sun":"moon");try{localStorage.setItem("th",t)}catch(e){}};
setTh(th);const swapTh=t=>{const R=document.documentElement;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){setTh(t);return}
  if(document.startViewTransition){document.startViewTransition(()=>setTh(t));return}
  R.classList.add('tt');setTh(t);setTimeout(()=>R.classList.remove('tt'),350)};
$('#theme').onclick=()=>swapTh(th==='dark'?'light':'dark');
document.querySelectorAll("[data-ic]").forEach(e=>e.insertAdjacentHTML("afterbegin",ic(e.dataset.ic)));
pick(ITEMS.some(x=>x.id===location.hash.slice(1))?location.hash.slice(1):ITEMS[0].id);
</script>
